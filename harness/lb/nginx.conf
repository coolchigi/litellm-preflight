# 1 worker process, so round-robin across replicas is one rotation instead of
# one per worker (several workers spread 12 requests 9/3 across 2 replicas).
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    include /etc/nginx/conf.d/*.conf;
}
