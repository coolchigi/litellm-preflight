name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --group dev pytest -q --cov=litellm_doctor --cov-branch --cov-report=term-missing

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build
        run: uv build --no-sources
      - name: Check what would ship
        run: uv run --no-project python scripts/check_dist.py
      - name: Check metadata the way PyPI does
        run: uvx twine check --strict dist/*
      - name: Install the wheel and run it
        run: |
          uv run --isolated --no-project --with dist/*.whl litellm-doctor --version
          uv run --isolated --no-project --with dist/*.whl litellm-doctor health-checks harness/config/health-checks.yaml --replicas 3
      - name: Install the sdist and run it
        run: uv run --isolated --no-project --with dist/*.tar.gz litellm-doctor --version

  workflows:
    name: Audit workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run zizmor
        run: uvx zizmor --offline .github/workflows
